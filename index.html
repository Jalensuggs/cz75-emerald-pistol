<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CZ-75 Emerald Chrome — procedural Three.js</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7dd7a6; background: rgba(0,0,0,.55); padding: 8px 10px;
        border: 1px solid #1d3d2c; border-radius: 6px; pointer-events: none;
        white-space: pre;
      }
      body.eval #hud { display: none; }
    </style>
  </head>

    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
